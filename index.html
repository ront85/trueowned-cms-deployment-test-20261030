<!doctype html><html lang="en"><meta charset="utf-8"><title>CMS deployment test</title><h1 id="title">Loading test content</h1><script>fetch("./content/state/content.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(v=>{const code=v.home?.sections?.[0]?.code||"";const match=code.match(/<h2 data-editable="headline">([^<]*)<\/h2>/);document.querySelector("#title").textContent=match?.[1]||"No published title"}).catch(()=>{document.querySelector("#title").textContent="Content unavailable"})</script></html>
